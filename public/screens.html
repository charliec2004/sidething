<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SideThing screens</title>
    <link rel="stylesheet" href="/screens.css" />
  </head>
  <body>
    <header>
      <h1>SideThing screens</h1>
      <p>
        Design previews with example content. Four top buttons open Now Playing,
        Time, Weather and Settings. The front button cycles views.
      </p>
    </header>
    <main class="gallery">
      <figure>
        <figcaption>Music · supported shuffle and repeat</figcaption>
        <div><iframe title="Music screen" src="/?demo=music"></iframe></div>
      </figure>
      <figure>
        <figcaption>YouTube · title, creator, 10-second seeking</figcaption>
        <div><iframe title="YouTube screen" src="/?demo=video"></iframe></div>
      </figure>
      <figure>
        <figcaption>X video · creator and video controls</figcaption>
        <div><iframe title="X video screen" src="/?demo=x"></iframe></div>
      </figure>
      <figure>
        <figcaption>Weather</figcaption>
        <div><iframe title="Weather screen" src="/?demo=weather"></iframe></div>
      </figure>
      <figure>
        <figcaption>Clock</figcaption>
        <div><iframe title="Clock screen" src="/?demo=clock"></iframe></div>
      </figure>
      <figure>
        <figcaption>Nothing playing</figcaption>
        <div><iframe title="Empty screen" src="/?demo=empty"></iframe></div>
      </figure>
      <figure>
        <figcaption>Connecting / reconnecting</figcaption>
        <div>
          <iframe title="Connecting screen" src="/?demo=connecting"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Playback unavailable</figcaption>
        <div>
          <iframe title="Unavailable screen" src="/?demo=unavailable"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Settings · brightness</figcaption>
        <div>
          <iframe title="Settings screen" src="/?demo=settings"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Music · paused</figcaption>
        <div>
          <iframe title="Music · paused" src="/?demo=music-paused"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Music · shuffle on</figcaption>
        <div>
          <iframe title="Music · shuffle on" src="/?demo=shuffle-on"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Music · repeat all</figcaption>
        <div>
          <iframe title="Music · repeat all" src="/?demo=repeat-all"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Music · repeat one</figcaption>
        <div>
          <iframe title="Music · repeat one" src="/?demo=repeat-one"></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Audio output · choose</figcaption>
        <div>
          <iframe
            title="Audio output · choose"
            src="/?demo=source-picker"
          ></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Audio output · loading</figcaption>
        <div>
          <iframe
            title="Audio output · loading"
            src="/?demo=source-loading"
          ></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Audio output · switching</figcaption>
        <div>
          <iframe
            title="Audio output · switching"
            src="/?demo=source-switching"
          ></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Audio output · unavailable</figcaption>
        <div>
          <iframe
            title="Audio output · unavailable"
            src="/?demo=source-unavailable"
          ></iframe>
        </div>
      </figure>
      <figure>
        <figcaption>Audio output · none available</figcaption>
        <div>
          <iframe
            title="Audio output · none available"
            src="/?demo=source-empty"
          ></iframe>
        </div>
      </figure>
    </main>
  </body>
</html>
